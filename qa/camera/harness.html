<!doctype html><html lang="zh-Hant"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><title>鏡頭連續性檢查</title><div id="app"><header class="brand"><b>鏡頭連續性檢查</b><span id="journey-time"></span></header><section class="world-stage"><canvas id="world-canvas" width="384" height="240"></canvas></section><p id="pose-label"></p><div class="actions"><button data-pos="0">行車開始</button><button data-pos="0.82">接近事件 82%</button><button data-pos="0.9999">停靠前一瞬</button><button data-pos="1">正式停靠</button></div><p id="journey-place"></p><p>時速 <span id="journey-speed"></span></p></div><script type="module">
import {Game} from './engine.js';import {mountWorld} from './world-view.js';const files=['assets/manifest.json','data/npc-catalog.json','data/oracles.json','data/events.json','data/building-events.json','data/traits.json','assets/encounters.json'];const v=await Promise.all(files.map(p=>fetch(p).then(r=>r.json())));const data={assets:v[0],catalog:v[1],oracles:v[2],events:v[3],buildings:v[4],traits:v[5]};let state;for(let seed=1;seed<2000;seed++){const g=new Game(data);g.start({seed:445});g.s.rng=seed;g.s.seed=0;g.s.minutes=1110;g.depart();const preview=g.previewArrival();if(preview.current?.event.id==='road_001'){g.s.travel.preview=preview;state=g.s;break;}}function show(pos){const s=structuredClone(state);if(pos===1){const game=new Game(data,s);game.arrive()}mountWorld(document.getElementById('world-canvas'),s,data.assets,v[6],{duration:1e8,travelStart:performance.now()-pos*1e8});document.getElementById('pose-label').textContent=pos===1?'已停靠':'行車進度 '+(pos*100).toFixed(2)+'%';}document.querySelectorAll('button[data-pos]').forEach(b=>b.onclick=()=>show(Number(b.dataset.pos)));show(0);
</script></html>
