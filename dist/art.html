<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>一路向東 · 像素圖鑑</title><style>*{box-sizing:border-box}body{margin:0;background:#111d29;color:#e7d8b6;font:14px/1.7 system-ui}header{padding:32px 24px;background:#1d3039;border-bottom:1px solid #526866}h1{margin:0;font-size:32px;letter-spacing:.2em}small{color:#81b9ac}main{max-width:1100px;margin:auto;padding:20px}h2{margin-top:35px}section{display:grid;grid-template-columns:repeat(auto-fill,minmax(115px,1fr));gap:10px}.tile{background:#20323c;border:1px solid #3b5159;border-radius:4px;padding:12px;text-align:center}.tile img{image-rendering:pixelated;object-fit:contain;max-width:100%;height:96px}.tile p{margin:5px 0;font-size:12px;color:#b9c4b7}.wide{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}.wide img{width:100%;height:auto}select{background:#263e47;color:#eddfc0;padding:12px;border:1px solid #789289;font:inherit;width:100%;margin-bottom:12px}.car{position:relative;width:100%;aspect-ratio:160/72;background:linear-gradient(#425466,#607871);image-rendering:pixelated}.car>.head{z-index:1}.car>img{position:absolute;inset:0;width:100%;height:100%}.car .head{position:absolute;height:auto;z-index:0}.car .body{z-index:1}.race-choices{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.race-choices button{min-height:44px;background:#263e47;color:#eddfc0;border:1px solid #789289;padding:8px 14px;font:inherit;cursor:pointer}.race-choices button[aria-pressed=true]{background:#c5aa70;color:#15232b}.vehicle-volume-preview{width:100%;height:auto;image-rendering:pixelated}.tile svg{display:block;max-width:100%;margin:auto}.atlas-art{height:102px;width:100%}.wide .atlas-art{height:155px}.wide .tile>img{max-height:155px;object-fit:contain}</style><header><small>EASTWARD / OCCUPIED EARTH</small><h1>一路向東</h1><div>原創像素圖鑑 · 種族、職業、車輛與異星荒原</div></header><main><h2>十二種族 · 每個人都有一段旅程</h2><section id="races"></section><h2>二十職業 · 240 種人物組合</h2><div id="race" class="race-choices" role="group" aria-label="選擇種族"></div><section id="jobs"></section><h2>十種起始座駕 · 一至二席</h2><section id="starterfleet" class="wide"></section><h2>車輛 · 朝向東方</h2><section id="vehicles" class="wide"></section><h2>旅人戰鬥立繪 · 十二種族</h2><section id="npccombat"></section><h2>敵人 · 公路不是空的</h2><section id="enemies"></section><h2>十二片佔領區 · 原創像素全景</h2><section id="roads" class="wide"></section><h2>車載武器</h2><section id="weapons"></section><h2>沿途建築與設施</h2><section id="facades" class="wide"></section><h2>路旁物件</h2><section id="roadprops"></section><h2>建築內部</h2><section id="buildings" class="wide"></section><h2>公路與建築 · 202 個事件圖像</h2><section id="encounters" class="wide"></section><h2>物品與改裝</h2><section id="icons"></section></main><script type="module">
import {useHdArt} from './hd-art.js?v=22-relief';
import {vehiclePreviewMarkup,mountVehiclePreviews,VEHICLE_WEAPON_ART} from './vehicle-volume.js?v=22-relief';
import {VEHICLE_WEAPONS,STARTER_VEHICLES} from './vehicle-catalog.js';
import {ROADSIDE_ATLAS} from './roadside-atlas.js?v=22-relief';
import {eventVolume,interiorSet} from './volume-events.js?v=22-relief';
const [base,c,e,hd,buildingsArt,eventArt]=await Promise.all(['assets/manifest.json','data/npc-catalog.json','assets/encounters.json','assets/hd2d/catalog.json','assets/volume/buildings.json','assets/volume/event-art.json'].map(p=>fetch(p+'?v=22-relief').then(r=>r.json())));
const m=useHdArt(base,hd,buildingsArt,eventArt);
const labels={gas:'加油站',garage:'修車廠',motel:'公路旅館',clinic:'診所',pharmacy:'藥房',warehouse:'倉庫',shop:'商店',checkpoint:'檢查哨',stall:'路邊攤',market:'露天市場',toll:'收費站',bridge:'斷橋',tunnel:'隧道',camp:'營地',scrapyard:'廢車場',memorial:'紀念牆',solar:'太陽能求助亭',hotel:'旅館',laboratory:'實驗室',ruin:'廢墟',nest:'巢穴',office:'辦公室',bath:'浴室',corridor:'走廊',stove:'鍋爐房',stairs:'樓梯間',partition:'儲藏隔間',pole:'電線桿',sign:'招牌',lamp:'路燈',shelter:'候車亭',rail:'護欄',barrier:'路障',container:'貨櫃',tower:'水塔'};
const tile=(file,name)=>`<div class="tile"><img loading="lazy" src="assets/${file}" alt="${name}"><p>${name}</p></div>`;
races.innerHTML=c.races.map(r=>tile(m.characters[r.id+'_driver'],r.name)).join('');let chosenRace='human';function update(){race.innerHTML=c.races.map(r=>`<button data-race="${r.id}" aria-pressed="${chosenRace===r.id}">${r.name}</button>`).join('');jobs.innerHTML=c.professions.map(j=>tile(m.characters[chosenRace+'_'+j.id],j.name)).join('')}race.onclick=e=>{const b=e.target.closest('button[data-race]');if(b){chosenRace=b.dataset.race;update()}};update();
function fleetTile(v,label){return '<div class="tile">'+vehiclePreviewMarkup(v,label)+'<p>'+label+'</p></div>';}
starterfleet.innerHTML=Object.entries(m.starters).map(([starterId,v])=>fleetTile({model:STARTER_VEHICLES.find(c=>c.id===starterId).model,starterId,mods:[]},v.name+' · '+v.seats+' 席')).join('');
vehicles.innerHTML=Object.entries(m.vehicles).map(([model,v])=>fleetTile({model,mods:[]},v.name+' · '+v.seats+' 席')).join('');
npccombat.innerHTML=c.races.map(r=>tile(m.characters[r.id+'_scavenger'],r.name)).join('');
enemies.innerHTML=Object.entries(m.enemies).map(([k,v])=>{const a=m.enemyAtlas[k];return `<div class="tile"><svg viewBox="${a.rect.join(' ')}" style="width:100%;height:120px;image-rendering:pixelated"><image href="assets/${a.image}" width="${a.size[0]}" height="${a.size[1]}"/></svg><p>${v.name}</p></div>`}).join('');roads.innerHTML=Object.entries(m.worlds).map(([k,v])=>`<div class="tile"><svg viewBox="${v.rect.join(' ')}" style="width:100%;image-rendering:pixelated"><image href="assets/${v.image}" width="${v.size[0]}" height="${v.size[1]}"/></svg><p>${k}</p></div>`).join('');function cropTile(asset,label){
  if(asset.rect[0]===0&&asset.rect[1]===0&&asset.rect[2]===asset.size?.[0]&&asset.rect[3]===asset.size[1])return tile(asset.image,label);
  return `<div class="tile"><svg class="atlas-art" viewBox="${asset.rect.join(' ')}" role="img" aria-label="${label}"><image href="assets/${asset.image}" width="${asset.size[0]}" height="${asset.size[1]}"/></svg><p>${label}</p></div>`;
}
document.getElementById('facades').innerHTML=Object.entries(m.facilities).map(([k,a])=>cropTile(a,labels[k])).join('');
document.getElementById('buildings').innerHTML=Object.entries(m.interiors).map(([k,a])=>cropTile(a,labels[k])).join('');
document.getElementById('weapons').innerHTML=Object.entries(VEHICLE_WEAPON_ART).map(([k,path])=>tile(path,VEHICLE_WEAPONS[k].name)).join('');
document.getElementById('roadprops').innerHTML=Object.entries(ROADSIDE_ATLAS).flatMap(([k,variants])=>variants.map(a=>cropTile(a,labels[k]))).join('');
icons.innerHTML=[...Object.entries(m.icons),...Object.entries(m.mods)].map(([k,v])=>tile(v,k)).join('');
document.getElementById('encounters').innerHTML=Object.values(e).map(a=>{
  const v=eventVolume(a,a.interior,m);
  if(v.type==='fleet')return fleetTile({model:v.models[0],mods:[]},a.title);
  const picture=v.type==='facade'?m.facilities[v.key]:v.type==='prop'?m.props[v.key]:v.type==='roadside'?ROADSIDE_ATLAS[v.key][0]:m.interiors[interiorSet(a)];
  return picture?cropTile(picture,a.title):tile(a.image,a.title);
}).join('');
mountVehiclePreviews(document,m,c.races.slice(0,4).map(r=>({race:r.id})));
</script></html>
