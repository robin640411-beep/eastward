<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>一路向東 · 像素圖鑑</title><style>*{box-sizing:border-box}body{margin:0;background:#111d29;color:#e7d8b6;font:14px/1.7 system-ui}header{padding:32px 24px;background:#1d3039;border-bottom:1px solid #526866}h1{margin:0;font-size:32px;letter-spacing:.2em}small{color:#81b9ac}main{max-width:1100px;margin:auto;padding:20px}h2{margin-top:35px}section{display:grid;grid-template-columns:repeat(auto-fill,minmax(115px,1fr));gap:10px}.tile{background:#20323c;border:1px solid #3b5159;border-radius:4px;padding:12px;text-align:center}.tile img{image-rendering:pixelated;object-fit:contain;max-width:100%;height:96px}.tile p{margin:5px 0;font-size:12px;color:#b9c4b7}.wide{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}.wide img{width:100%;height:auto}select{background:#263e47;color:#eddfc0;padding:12px;border:1px solid #789289;font:inherit;width:100%;margin-bottom:12px}.car{position:relative;width:100%;aspect-ratio:160/72;background:linear-gradient(#425466,#607871);image-rendering:pixelated}.car>img{position:absolute;inset:0;width:100%;height:100%}.car .head{position:absolute;height:auto;z-index:0}.car .body{z-index:1}</style><header><small>EASTWARD / OCCUPIED EARTH / ART EDITION 02</small><h1>一路向東</h1><div>原創像素圖鑑 · 種族、職業、車輛與異星荒原</div></header><main><h2>十二種族 · 每個人都有一段旅程</h2><section id="races"></section><h2>二十職業 · 240 種人物組合</h2><select id="race"></select><section id="jobs"></section><h2>車輛 · 朝向東方</h2><section id="vehicles" class="wide"></section><h2>敵人 · 公路不是空的</h2><section id="enemies"></section><h2>十二片佔領區 · 原創像素全景</h2><section id="roads" class="wide"></section><h2>建築內部</h2><section id="buildings" class="wide"></section><h2>公路與建築 · 202 個事件圖像</h2><section id="encounters" class="wide"></section><h2>物品與改裝</h2><section id="icons"></section></main><script type="module">
const [m,c,e]=await Promise.all([fetch('assets/manifest.json').then(r=>r.json()),fetch('data/npc-catalog.json').then(r=>r.json()),fetch('assets/encounters.json').then(r=>r.json())]);
const tile=(file,name)=>`<div class="tile"><img loading="lazy" src="assets/${file}" alt="${name}"><p>${name}</p></div>`;
races.innerHTML=c.races.map(r=>tile(m.characters[r.id+'_driver'],r.name)).join('');race.innerHTML=c.races.map(r=>`<option value="${r.id}">${r.name}</option>`).join('');function update(){jobs.innerHTML=c.professions.map(j=>tile(m.characters[race.value+'_'+j.id],j.name)).join('')}race.onchange=update;update();
vehicles.innerHTML=Object.entries(m.vehicles).map(([k,v],i)=>`<div class="tile"><div class="car">${v.windows.map((w,j)=>`<img class="head" src="assets/${m.portraits[c.races[(i+j)%12].id]}" style="left:${100*w.x/160}%;top:${100*w.y/72}%;width:${100*Math.min(w.width,w.height)/160}%" alt="乘員">`).join('')}<img class="body" src="assets/${v.image}" alt="${v.name}"></div><p>${v.name} · ${v.seats} 席</p></div>`).join('');
enemies.innerHTML=Object.entries(m.enemies).map(([k,v])=>{const a=m.enemyAtlas[k];return `<div class="tile"><svg viewBox="${a.rect.join(' ')}" style="width:100%;height:120px;image-rendering:pixelated"><image href="assets/${a.image}" width="${a.size[0]}" height="${a.size[1]}"/></svg><p>${v.name}</p></div>`}).join('');roads.innerHTML=Object.entries(m.worlds).map(([k,v])=>`<div class="tile"><svg viewBox="${v.rect.join(' ')}" style="width:100%;image-rendering:pixelated"><image href="assets/${v.image}" width="${v.size[0]}" height="${v.size[1]}"/></svg><p>${k}</p></div>`).join('');buildings.innerHTML=Object.entries(m.interiors).map(([k,a])=>`<div class="tile"><svg viewBox="${a.rect.join(' ')}" style="width:100%;image-rendering:pixelated"><image href="assets/${a.image}" width="${a.size[0]}" height="${a.size[1]}"/></svg><p>${k}</p></div>`).join('');icons.innerHTML=[...Object.entries(m.icons),...Object.entries(m.mods)].map(([k,v])=>tile(v,k)).join('');
document.getElementById('encounters').innerHTML=Object.values(e).map(v=>tile(v.image,v.title)).join('');
</script></html>
